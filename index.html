<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Legend of YMIR NFT Character Search</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;

            background: #111318;
            color: #eeeeee;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #999999;
            margin-bottom: 30px;
        }

        /* ----------------------------------------------------
           Search
        ---------------------------------------------------- */

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        #searchInput {
            flex: 1;

            padding: 14px;

            font-size: 16px;

            background: #1c1f26;
            color: white;

            border: 1px solid #343943;
            border-radius: 6px;

            outline: none;
        }

        #searchInput:focus {
            border-color: #d4b36a;
        }

        button {
            padding: 12px 18px;

            border: none;
            border-radius: 6px;

            background: #d4b36a;
            color: #111111;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        /* ----------------------------------------------------
           Toolbar
        ---------------------------------------------------- */

        .toolbar {
            display: flex;
            gap: 10px;

            margin-bottom: 25px;
        }

        /* ----------------------------------------------------
           Result count
        ---------------------------------------------------- */

        #resultCount {
            margin-bottom: 15px;
            color: #aaaaaa;
        }

        /* ----------------------------------------------------
           Table
        ---------------------------------------------------- */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            background: #181b21;
        }

        th,
        td {
            padding: 12px 15px;

            text-align: left;

            border-bottom: 1px solid #2a2e36;
        }

        th {
            background: #22262e;

            position: sticky;
            top: 0;
        }

        tbody tr:hover {
            background: #20242c;
        }

        .id {
            color: #999999;
            width: 120px;
        }

        .link-column {
            width: 140px;
        }

        /* ----------------------------------------------------
           Links
        ---------------------------------------------------- */

        a {
            color: #d4b36a;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* ----------------------------------------------------
           Empty result
        ---------------------------------------------------- */

        .empty {
            padding: 30px;

            text-align: center;

            background: #181b21;

            color: #888888;

            border-radius: 6px;
        }

        /* ----------------------------------------------------
           Mobile
        ---------------------------------------------------- */

        @media (max-width: 600px) {

            .container {
                padding: 25px 15px;
            }

            .search-container {
                flex-direction: column;
            }

            .toolbar {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

    </style>

</head>


<body>

<div class="container">

    <h1>
        Legend of YMIR
    </h1>

    <div class="subtitle">
        NFT Character Search
    </div>


    <!-- =====================================================
         Search
    ====================================================== -->

    <div class="search-container">

        <input
            id="searchInput"
            type="text"
            placeholder="Search character name..."
            autocomplete="off"
        >

        <button onclick="searchCharacters()">
            Search
        </button>

    </div>


    <!-- =====================================================
         Buttons
    ====================================================== -->

    <div class="toolbar">

        <button onclick="showAll()">
            Show All Characters
        </button>

        <button onclick="clearResults()">
            Clear
        </button>

    </div>


    <!-- =====================================================
         Results
    ====================================================== -->

    <div id="resultCount"></div>

    <div
        id="results"
        class="table-container"
    ></div>

</div>

const BASE_URL = "https://www.legendofymir.com/en/blockchain/nft/";


// ============================================================
// Escape HTML
// ============================================================

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


// ============================================================
// Create result table
// ============================================================

function createTable(data) {

    const results =
        document.getElementById("results");

    const resultCount =
        document.getElementById("resultCount");


    // --------------------------------------------------------
    // Nothing found
    // --------------------------------------------------------

    if (data.length === 0) {

        results.innerHTML = `
            <div class="empty">
                No characters found.
            </div>
        `;

        resultCount.textContent =
            "0 characters found";

        return;
    }


    // --------------------------------------------------------
    // Result count
    // --------------------------------------------------------

    resultCount.textContent =
        `${data.length.toLocaleString()} character(s) found`;


    // --------------------------------------------------------
    // Table header
    // --------------------------------------------------------

    let html = `
        <table>

            <thead>

                <tr>
                    <th>
                        NFT ID
                    </th>

                    <th>
                        Character Name
                    </th>

                    <th>
                        Link
                    </th>
                </tr>

            </thead>

            <tbody>
    `;


    // --------------------------------------------------------
    // Rows
    // --------------------------------------------------------

    for (const character of data) {

        const nftId =
            character.nft_id;

        const characterName =
            escapeHtml(
                character.character_name
            );

        const url =
            BASE_URL +
            encodeURIComponent(nftId);


        html += `
            <tr>

                <td class="id">
                    ${nftId}
                </td>


                <td>
                    ${characterName}
                </td>


                <td class="link-column">

                    <a
                        href="${url}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        View NFT
                    </a>

                </td>

            </tr>
        `;
    }


    // --------------------------------------------------------
    // Finish table
    // --------------------------------------------------------

    html += `
            </tbody>

        </table>
    `;


    results.innerHTML = html;
}


// ============================================================
// Search characters
// ============================================================

function searchCharacters() {

    const query = document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    // Nothing typed
    if (!query) {

        clearResults();

        return;
    }


    // Partial + case-insensitive search
    const matches = characters.filter(
        character =>
            character.character_name
                .toLowerCase()
                .includes(query)
    );


    // Sort exact matches first, then alphabetically
    matches.sort((a, b) => {

        const nameA =
            a.character_name.toLowerCase();

        const nameB =
            b.character_name.toLowerCase();


        const exactA =
            nameA === query;

        const exactB =
            nameB === query;


        if (exactA && !exactB) {
            return -1;
        }

        if (!exactA && exactB) {
            return 1;
        }

        return nameA.localeCompare(nameB);
    });


    createTable(matches);
}


// ============================================================
// Show every character
// ============================================================

function showAll() {

    const sorted = [...characters].sort(
        (a, b) =>
            a.nft_id - b.nft_id
    );

    createTable(sorted);
}


// ============================================================
// Clear
// ============================================================

function clearResults() {

    document
        .getElementById("results")
        .innerHTML = "";

    document
        .getElementById("resultCount")
        .textContent = "";

    document
        .getElementById("searchInput")
        .value = "";
}


// ============================================================
// Automatically search while typing
// ============================================================

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        searchCharacters
    );


// ============================================================
// Pressing Enter also searches
// ============================================================

document
    .getElementById("searchInput")
    .addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                searchCharacters();
            }

        }
    );

</script>
