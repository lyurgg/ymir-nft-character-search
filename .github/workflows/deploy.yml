name: Update character data and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # GitHub Actions uses UTC. 16:00 UTC = 12:00 AM in the Philippines (UTC+8).
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check data parsing and persistence
        run: python -m unittest -v test_character_data test_build_site test_funding test_json_store

      - name: Scrape character data
        run: python -u extract_name_parallel.py --end-id 5000

      - name: Persist price and name observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add characters.csv character_history.json scan_report.json
          git add -A -- ':(glob)character_history.part-*.json'
          if ! git diff --cached --quiet; then
            git commit -m "Update character observations [skip ci]"
            git push origin HEAD:main
          fi

      - name: Generate and verify both website pages
        run: python build_site.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser logic
        run: |
          node test_frontend.cjs
          node test_graph.cjs
          node test_graph_page.cjs
          node test_funding.cjs

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
